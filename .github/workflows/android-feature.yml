name: Feature branch Android build
on:
  workflow_dispatch:
  push:
    branches: [feature/world-survival-overhaul]
    paths: [.github/taiga-build-now]
concurrency:
  group: taiga-feature-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/ ~/.config/
          cp -r /root/.config/godot ~/.config/godot || true
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ || true
      - name: Import project resources
        continue-on-error: true
        run: |
          cd game
          timeout 600 godot --headless --import 2>&1 | tee /tmp/import.log
          grep -E "Parse Error|Failed loading resource" /tmp/import.log || true
      - name: "Сценарий: все игровые скрипты компилируются"
        continue-on-error: true
        run: |
          cd game
          parse_failed=0
          for f in scripts/*.gd tests/*.gd; do
            rc=0; log=$(godot --headless --check-only --script "$f" 2>&1) || rc=$?
            if [ $rc -ne 0 ]; then
              msg=$(echo "$log" | grep -vE '^\s*$' | tail -10 | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error file=game/$f::check-only rc=$rc: $msg"
              parse_failed=1
            fi
          done
          exit "$parse_failed"
      - name: "Сценарии: окружение, столкновения животных, анимации, болота"
        continue-on-error: true
        run: |
          cd game
          set +e
          for test in environment_glb_test.gd animal_collision_test.gd animal_animation_speed_test.gd wetland_biome_test.gd; do
            case "$test" in
              environment_glb_test.gd) title="Модели окружения загружаются" ;;
              animal_collision_test.gd) title="Животные корректно сталкиваются с окружением" ;;
              animal_animation_speed_test.gd) title="Анимации животных имеют корректную скорость" ;;
              wetland_biome_test.gd) title="Болотный биом работает" ;;
            esac
            echo "=== СЦЕНАРИЙ: $title ($test) ==="
            timeout 180 godot --headless --script "res://tests/$test"
            echo "=== EXIT $test: $? ==="
          done
          exit 0
      - name: "Сценарий: главная игровая сцена запускается без ошибок"
        continue-on-error: true
        run: |
          cd game
          timeout 300 godot --headless --quit-after 120 res://scenes/main.tscn 2>&1 | tee /tmp/smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid call|Nonexistent" /tmp/smoke.log
      - name: "Сценарий: Android APK успешно собирается"
        continue-on-error: true
        run: |
          mkdir -p build
          cd game
          godot --headless --export-debug "Android" ../build/taiga.apk
          test -s ../build/taiga.apk
      - name: "Сценарий: исходники упаковываются для пользователя"
        continue-on-error: true
        run: |
          test -s PROJECT_RULES.md && test -s VERSION_CONTROL.md && zip -qr build/taiga-project.zip game README.md PROJECT_RULES.md VERSION_CONTROL.md ART_DIRECTION.md CHANGELOG.md WORLD_SURVIVAL_OVERHAUL_2026-11-27.md .github/workflows
          test -s build/taiga-project.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taiga-feature-apk-and-source
          path: |
            build/taiga.apk
            build/taiga-project.zip
          if-no-files-found: error
          retention-days: 30
