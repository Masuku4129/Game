name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install software GPU
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri >/dev/null
      - name: Import project
        run: cd game && (timeout 600 godot --headless --import || true)
      - name: Render style test shots
        run: |
          mkdir -p /tmp/pv
          cd game
          SHOTS=/tmp/pv timeout 600 xvfb-run -a -s "-screen 0 1920x864x24" godot --rendering-driver vulkan --resolution 1920x864 res://scenes/style_test.tscn 2>&1 | grep -iE "error|shot" | head -40 || true
          ls /tmp/pv
      - name: Publish preview frames to branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan preview
          git rm -rf -q . || true
          rm -rf game preview
          cp /tmp/pv/*.png . && git add *.png
          git commit -q -m "Кадры предпросмотра"
          git push -f origin preview
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot templates and editor settings
        run: |
          mkdir -p ~/.local/share/godot/export_templates/ ~/.config/
          cp -r /root/.config/godot ~/.config/godot || true
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ || true
      - name: Import project
        run: cd game && (timeout 600 godot --headless --import || true)
      - name: Check scripts
        run: |
          cd game
          for f in scripts/*.gd; do godot --headless --check-only --script "$f" 2>&1 | grep -E "SCRIPT ERROR|Parse Error|ERROR" && exit 1 || true; done
      - name: Smoke test (запуск сцены без экрана)
        run: |
          cd game
          timeout 300 godot --headless --quit-after 60 res://scenes/main.tscn 2>&1 | tee ../smoke.log | tail -40
          ! grep -E "SCRIPT ERROR|Invalid|Cannot|Nonexistent" ../smoke.log
      - name: Export APK
        run: |
          mkdir -p build
          cd game && godot --headless --export-debug "Android" ../build/taiga.apk
          test -s ../build/taiga.apk
      - uses: actions/upload-artifact@v4
        with:
          name: taiga-apk
          path: build/taiga.apk
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          prerelease: true
          files: build/taiga.apk
