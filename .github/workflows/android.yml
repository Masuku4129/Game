name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install software GPU
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri >/dev/null
      - name: Import project
        run: |
          mkdir -p /tmp/pv
          cd game
          timeout 600 godot --headless --import 2>&1 | tee /tmp/pv/import.log
          ! grep -E "Parse Error|Failed loading resource" /tmp/pv/import.log
      - name: Render style test shots
        run: |
          mkdir -p /tmp/pv
          cd game
          COLONY_SHOTS=/tmp/pv timeout 900 xvfb-run -a -s "-screen 0 1920x864x24" godot --rendering-driver vulkan --resolution 1920x864 > /tmp/pv/colony.txt 2>&1 || true
          grep -v ALSA /tmp/pv/colony.txt | tail -60 > /tmp/pv/colony_tail.txt; grep -E "CL |SCRIPT" /tmp/pv/colony.txt | head -30 || true
          SHOTS=/tmp/pv timeout 600 xvfb-run -a -s "-screen 0 1920x864x24" godot --rendering-driver vulkan --resolution 1920x864 2>&1 | grep -iE "SCRIPT ERROR|shot" | head -20 || true
          ls /tmp/pv
      - name: Render imported GLB asset gallery
        run: |
          cd game
          ASSET_GALLERY_SHOTS=/tmp/pv/taiga_asset_gallery.png timeout 180 xvfb-run -a -s "-screen 0 1920x864x24" godot --rendering-driver vulkan --resolution 1920x864 res://scenes/asset_gallery.tscn 2>&1 | tee /tmp/pv/asset_gallery.log
          test -s /tmp/pv/taiga_asset_gallery.png
          grep "TAIGA_ASSET_GALLERY loaded=9" /tmp/pv/asset_gallery.log
      - name: Upload visual verification frames
        uses: actions/upload-artifact@v4
        with:
          name: taiga-visual-review
          path: |
            /tmp/pv/taiga_asset_gallery.png
            /tmp/pv/asset_gallery.log
          if-no-files-found: error
          retention-days: 30
      - name: Publish preview frames to branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan preview
          git rm -rf -q . || true
          rm -rf game preview
          cp /tmp/pv/*.png . && cp /tmp/pv/colony_tail.txt . && git add *.png colony_tail.txt
          git commit -q -m "Кадры предпросмотра"
          git push -f origin preview
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot templates and editor settings
        run: |
          mkdir -p ~/.local/share/godot/export_templates/ ~/.config/
          cp -r /root/.config/godot ~/.config/godot || true
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ || true
      - name: Import project
        run: cd game && (timeout 600 godot --headless --import || true)
      - name: Animal obstacle-clearance regression test
        run: |
          cd game
          timeout 120 godot --headless --script res://tests/animal_collision_test.gd
      - name: Animal animation speed regression test
        run: |
          cd game
          timeout 120 godot --headless --script res://tests/animal_animation_speed_test.gd
      - name: Check scripts (strict)
        run: |
          cd game
          fail=0
          for f in scripts/*.gd; do
            log=$(godot --headless --check-only --script "$f" 2>&1); rc=$?
            if [ $rc -ne 0 ] || echo "$log" | grep -qE "SCRIPT ERROR|Parse Error|ERROR"; then
              msg=$(echo "$log" | grep -vE '^\s*$' | tail -8 | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error file=game/$f::check-only rc=$rc: $msg"
              fail=1
            fi
          done
          exit $fail
      - name: Smoke test (запуск сцены без экрана)
        run: |
          cd game
          timeout 300 godot --headless --quit-after 60 res://scenes/main.tscn 2>&1 | tee ../smoke.log | tail -40
          ! grep -E "SCRIPT ERROR|Invalid|Cannot|Nonexistent" ../smoke.log
      - name: Rock footprint collision regression test
        run: |
          cd game
          timeout 180 godot --headless --script res://tests/rock_collision_test.gd
      - name: Export APK
        run: |
          mkdir -p build
          cd game && godot --headless --export-debug "Android" ../build/taiga.apk
          test -s ../build/taiga.apk
      - name: Package complete project source
        run: |
          zip -qr build/taiga-project.zip game README.md ART_DIRECTION.md CHANGELOG.md .github/workflows/android.yml
          test -s build/taiga-project.zip
      - uses: actions/upload-artifact@v4
        with:
          name: taiga-apk-and-project
          path: |
            build/taiga.apk
            build/taiga-project.zip
      - name: Publish APK and source ZIP to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          prerelease: true
          files: |
            build/taiga.apk
            build/taiga-project.zip
