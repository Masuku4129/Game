name: Python Android APK

on:
  push:
    branches: [python-panda3d-port]
    paths:
      - "python_game/**"
      - ".github/workflows/python-android-apk.yml"
      - "assets/**"
  pull_request:
    branches: [main]
    paths:
      - "python_game/**"
      - ".github/workflows/python-android-apk.yml"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test Python runtime and package Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python_game/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --pre --extra-index-url https://archive.panda3d.org/ panda3d
          python -m pip install panda3d-gltf==1.3.0 panda3d-simplepbr==0.13.1 pytest

      - name: Run deterministic world tests
        working-directory: python_game
        run: pytest -q

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Download Panda3D Android ARM64 wheel
        working-directory: python_game
        run: |
          mkdir -p android_wheels
          wheel="android_wheels/panda3d-1.11.0-cp313-cp313-android_arm64.whl"
          downloaded=false
          for url in \
            https://rdb.name/panda3d-1.11.0-cp313-cp313-android_arm64-r26b.whl \
            https://rdb.name/panda3d-1.11.0-cp313-cp313-android_arm64.whl; do
            if curl --retry 3 --retry-delay 2 -fL "$url" -o "$wheel"; then
              if unzip -t "$wheel"; then
                downloaded=true
                echo "Using Android ARM64 wheel: $url"
                break
              fi
            fi
          done
          test "$downloaded" = true
          test -s "$wheel"
          ls -lh "$wheel"
          unzip -l "$wheel" | head -n 25

      - name: Stage authored GLB assets
        run: cp -R assets python_game/assets

      - name: Bake ground texture and seasonal forest scenes
        working-directory: python_game
        run: |
          python tools/generate_ground_texture.py --output assets/textures/ground_albedo.png --size 512
          python tools/build_forest.py --assets assets/generated --output assets/generated --radius 11
          test -s assets/textures/ground_albedo.png
          for season in spring summer autumn winter; do test -s "assets/generated/forest_${season}.bam"; done

      - name: Headless scene startup smoke test
        working-directory: python_game
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WILDLANDS_HEADLESS: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          set +e
          timeout 25s xvfb-run -a python -u main.py 2>&1 | tee "$RUNNER_TEMP/wildlands-smoke.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 124 ]; then
            echo "Scene exited unexpectedly with code $code"
            exit 1
          fi
          grep -q "PLAYER_MODEL_LOADED:" "$RUNNER_TEMP/wildlands-smoke.log"
          echo "HEADLESS_SCENE_STARTUP: PASS (scene remained active for 25 seconds)"

      - name: Build Panda3D Android App Bundle
        working-directory: python_game
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          python setup.py bdist_apps
          test -s dist/wildlands-0.1.0_android.aab

      - name: Install bundletool
        run: |
          curl -fL https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o "$RUNNER_TEMP/bundletool.jar"

      - name: Convert AAB to installable universal APK
        working-directory: python_game
        run: |
          mkdir -p build
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/wildlands-debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Wildlands Debug,O=Wildlands,C=US" -keyalg RSA -keysize 2048 -validity 10000
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle=dist/wildlands-0.1.0_android.aab \
            --output=build/wildlands.apks --mode=universal \
            --ks="$RUNNER_TEMP/wildlands-debug.keystore" \
            --ks-key-alias=androiddebugkey --ks-pass=pass:android --key-pass=pass:android
          unzip -p build/wildlands.apks universal.apk > build/Wildlands-debug.apk
          test -s build/Wildlands-debug.apk
          unzip -t build/Wildlands-debug.apk
          file build/Wildlands-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Wildlands-Python-Android-arm64-${{ github.sha }}
          path: python_game/build/Wildlands-debug.apk
          if-no-files-found: error
          retention-days: 14
