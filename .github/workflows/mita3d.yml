name: Mita 3D APK
on:
  push:
    branches: [masuku-game]
    paths: ["mita3d/**", ".github/workflows/mita3d.yml"]
  workflow_dispatch:
concurrency:
  group: mita3d-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot templates and editor settings
        run: |
          mkdir -p ~/.local/share/godot/export_templates/ ~/.config/
          cp -r /root/.config/godot ~/.config/godot || true
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ || true
      - name: Import project
        run: cd mita3d && (timeout 600 godot --headless --import || true)
      - name: Smoke test
        run: |
          cd mita3d
          timeout 300 godot --headless --quit-after 120 res://scenes/game.tscn 2>&1 | tee ../smoke.log | tail -30
          ! grep -E "SCRIPT ERROR|Parse Error" ../smoke.log
      - name: Export APK
        run: |
          mkdir -p build
          cd mita3d && godot --headless --export-debug "Android" ../build/mita.apk
          test -s ../build/mita.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mita-apk
          path: build/mita.apk
      - name: Publish to "mita-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mita-latest
          name: Мита 3D, последняя сборка
          prerelease: true
          files: build/mita.apk
