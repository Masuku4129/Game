name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "PROJECT_MASTER.md"
      - "docs/**"
      - "README.md"
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate 3D asset pack"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Build and validate Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709" "cmake;3.10.2.4988404"

      - name: Restore Godot 4.7.2 toolchain cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot-4.7.2/godot
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: ${{ runner.os }}-godot-4.7.2-stable-linux-x64-v1

      - name: Install Godot 4.7.2 when cache is empty
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.cache/godot-4.7.2" "$HOME/.local/share/godot/export_templates/4.7.2.stable" "$RUNNER_TEMP/godot"
          curl -fL "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          install "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$HOME/.cache/godot-4.7.2/godot"
          curl -fL "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp "$RUNNER_TEMP/godot/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Activate cached Godot
        run: |
          test -x "$HOME/.cache/godot-4.7.2/godot"
          test -n "$(find "$HOME/.local/share/godot/export_templates/4.7.2.stable" -maxdepth 1 -type f -print -quit)"
          sudo ln -sf "$HOME/.cache/godot-4.7.2/godot" /usr/local/bin/godot

      - name: Import project and validate scripts
        run: |
          godot --version
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" "$RUNNER_TEMP/godot-import.log"

      - name: Run headless startup smoke test
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 3 2>&1 | tee "$RUNNER_TEMP/godot-smoke.log"
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" "$RUNNER_TEMP/godot-smoke.log"

      - name: Test touch joystick and player displacement
        run: |
          set -o pipefail
          godot --headless --path . --script tests/movement_smoke.gd 2>&1 | tee "$RUNNER_TEMP/movement-test.log"
          grep -F "MOVEMENT_TEST_PASS" "$RUNNER_TEMP/movement-test.log"

      - name: Test weather, footprints, puddles and wind
        run: |
          set -o pipefail
          godot --headless --path . --script tests/environment_smoke.gd 2>&1 | tee "$RUNNER_TEMP/environment-test.log"
          grep -F "ENVIRONMENT_TEST_PASS" "$RUNNER_TEMP/environment-test.log"

      - name: Test deformable snow, mud and runoff simulation
        run: |
          set -o pipefail
          godot --headless --path . --script tests/surface_simulation_smoke.gd 2>&1 | tee "$RUNNER_TEMP/surface-test.log"
          grep -F "SURFACE_TEST_PASS" "$RUNNER_TEMP/surface-test.log"

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/Game-debug.apk
          test -s build/Game-debug.apk
          unzip -t build/Game-debug.apk

      - name: Verify APK Android signature
        run: |
          apksigner verify --verbose --print-certs build/Game-debug.apk

      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r build/Game-debug.apk
            adb shell monkey -p org.kira.game -c android.intent.category.LAUNCHER 1
            sleep 15
            adb logcat -d -t 5000 > "$RUNNER_TEMP/android-launch.log"
            adb shell pidof org.kira.game
            ! grep -E "FATAL EXCEPTION|Fatal signal|SIGSEGV|Process org.kira.game has died" "$RUNNER_TEMP/android-launch.log"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Game-Android-debug-${{ github.sha }}
          path: build/Game-debug.apk
          if-no-files-found: error
          retention-days: 14
