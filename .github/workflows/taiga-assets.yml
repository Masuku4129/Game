name: Taiga asset validation

on:
  push:
    branches: [feat/taiga-asset-foundation]
    paths:
      - 'game/models/**'
      - 'tools/validate_taiga_gltf.py'
      - '.github/workflows/taiga-assets.yml'
  pull_request:
    paths:
      - 'game/models/**'
      - 'tools/validate_taiga_gltf.py'
      - '.github/workflows/taiga-assets.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate embedded glTF geometry, normals and vertex colors
        run: python tools/validate_taiga_gltf.py
  godot-import:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import Godot project and model resources
        run: |
          cd game
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          ! grep -E 'ERROR:|Parse Error|Failed loading' /tmp/godot-import.log
