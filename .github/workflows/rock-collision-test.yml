name: Rock Collision Tests
on:
  push:
    branches: [rock-collision]
concurrency:
  group: taiga-rock-collision-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install software GPU
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri >/dev/null
      - name: Import project
        run: |
          cd game
          timeout 300 godot --headless --import 2>&1 | tee /tmp/import.log
          ! grep -E "Parse Error|Failed loading resource" /tmp/import.log
      - name: Animal obstacle-clearance regression
        run: |
          cd game
          timeout 120 godot --headless --script res://tests/animal_collision_test.gd
      - name: Rock footprint regression
        run: |
          cd game
          timeout 180 godot --headless --script res://tests/rock_collision_test.gd
      - name: Strict script parse
        run: |
          cd game
          for f in scripts/*.gd tests/*.gd; do
            godot --headless --check-only --script "$f"
          done
      - name: Smoke scene
        run: |
          cd game
          timeout 120 godot --headless --quit-after 120 res://scenes/main.tscn > /tmp/smoke.log 2>&1
          ! grep -E "SCRIPT ERROR|Parse Error" /tmp/smoke.log
      - name: Render gameplay
        run: |
          mkdir -p /tmp/rock
          cd game
          SHOTS=/tmp/rock timeout 600 xvfb-run -a -s "-screen 0 1920x864x24" godot --rendering-driver vulkan --resolution 1920x864 > /tmp/rock/gameplay.log 2>&1
          grep -E "SCRIPT ERROR|Parse Error|shot game" /tmp/rock/gameplay.log
          test -s /tmp/rock/game_20.png
          test -s /tmp/rock/game_80.png
      - name: Upload verification
        uses: actions/upload-artifact@v4
        with:
          name: rock-collision-review
          path: |
            /tmp/rock/*.png
            /tmp/rock/*.log
          if-no-files-found: error
          retention-days: 30
