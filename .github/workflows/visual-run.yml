name: Visual Run Capture
on:
  push:
    branches: [visual-run]
  workflow_dispatch:
concurrency:
  group: taiga-visual-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip wget
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          test -x /tmp/godot/Godot_v4.3-stable_linux.x86_64
      - name: Import project resources
        run: cd game && timeout 300 /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Verify generated models, wildlife collision and animation
        run: |
          cd game
          set -o pipefail
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/model_geometry_test.gd
          timeout 300 /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/animal_model_visual_test.gd
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/animal_collision_test.gd
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/animal_animation_speed_test.gd
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/animal_scheduler_test.gd
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tests/rock_collision_test.gd
      - name: Capture current game scene
        run: |
          cd game
          timeout 300 xvfb-run -a /tmp/godot/Godot_v4.3-stable_linux.x86_64 --path . --rendering-method gl_compatibility --script res://tests/visual_capture.gd
          test -s /tmp/taiga_visual.png
          file /tmp/taiga_visual.png
      - uses: actions/upload-artifact@v4
        with:
          name: taiga-visual-capture
          path: /tmp/taiga_visual.png
          if-no-files-found: error
