name: Fetch Poly Haven assets
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "ID ассетов через пробел (пусто = обновить каталог)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          if [ -z "${{ inputs.ids }}" ]; then python3 tools/fetch_polyhaven.py catalog; else python3 tools/fetch_polyhaven.py get ${{ inputs.ids }}; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools game/assets || true
          git diff --cached --quiet || (git commit -m "Ассеты Poly Haven: ${{ inputs.ids || 'каталог' }}" && git push)
