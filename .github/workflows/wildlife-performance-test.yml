name: Wildlife Performance Tests
on:
  push:
    branches: [wildlife-performance]
concurrency:
  group: taiga-wildlife-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: |
          cd game
          timeout 300 godot --headless --import 2>&1 | tee /tmp/import.log
          ! grep -E "Parse Error|Failed loading resource" /tmp/import.log
      - name: Adaptive wildlife scheduler regression
        run: |
          cd game
          timeout 120 godot --headless --script res://tests/animal_scheduler_test.gd
      - name: Strict script parse
        run: |
          cd game
          for f in scripts/*.gd tests/*.gd; do
            godot --headless --check-only --script "$f"
          done
      - name: Wildlife performance baseline
        run: |
          cd game
          PERF=1 timeout 300 godot --headless res://scenes/main.tscn 2>&1 | tee /tmp/perf.log
          grep "PERF всё" /tmp/perf.log
      - name: Upload performance log
        uses: actions/upload-artifact@v4
        with:
          name: wildlife-performance-log
          path: /tmp/perf.log
          retention-days: 30
      - name: Smoke scene
        run: |
          cd game
          timeout 120 godot --headless --quit-after 120 res://scenes/main.tscn > /tmp/smoke.log 2>&1
          ! grep -E "SCRIPT ERROR|Parse Error" /tmp/smoke.log
