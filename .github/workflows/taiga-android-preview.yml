name: Taiga Android preview APK

on:
  push:
    branches: [feat/taiga-asset-foundation]
    paths:
      - 'game/**'
      - 'tools/validate_taiga_gltf.py'
      - '.github/workflows/taiga-android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4
      - name: Configure Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/ ~/.config/
          cp -r /root/.config/godot ~/.config/godot || true
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ || true
      - name: Import Godot project
        run: |
          cd game
          godot --headless --editor --path . --quit
      - name: Export Android APK
        run: |
          mkdir -p build
          cd game
          godot --headless --path . --export-debug "Android" ../build/taiga-preview.apk
          test -s ../build/taiga-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: taiga-preview-apk
          path: build/taiga-preview.apk
          if-no-files-found: error
