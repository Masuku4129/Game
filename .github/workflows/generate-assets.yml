name: Generate 3D asset pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/generate_assets.py"
      - "tools/generate_character.py"
      - ".github/workflows/generate-assets.yml"

permissions:
  contents: write

concurrency:
  group: generate-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Restore Blender package cache
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ runner.os }}-blender-apt-packages-v1

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
      - name: Generate GLB models
        run: |
          blender --background --python tools/generate_assets.py -- --output assets/generated
          blender --background --python tools/generate_character.py
          test -s assets/character/field_explorer.glb
          families="tree_spruce tree_pine tree_birch shrub_mixed fern_cluster rock_mossy grass_tuft stone_cluster stump_mossy fallen_log mushroom_cluster"
          seasons="spring summer autumn winter"
          seasonal_count=0
          for family in $families; do
            for season in $seasons; do
              file="assets/generated/${family}_${season}.glb"
              if [ ! -s "$file" ]; then
                echo "::error::Missing or empty seasonal asset: $file"
                exit 1
              fi
              seasonal_count=$((seasonal_count + 1))
            done
          done
          total_count=$(find assets/generated -maxdepth 1 -type f -name '*.glb' | wc -l)
          echo "Validated seasonal variants: $seasonal_count"
          echo "Total GLB files including legacy base models: $total_count"
          find assets/generated -maxdepth 1 -type f -name '*.glb' -printf '%f %s bytes\n' | sort
          test "$seasonal_count" -eq 44
          python3 - <<'PY'
          import json, pathlib, struct
          files = sorted(pathlib.Path("assets/generated").glob("*_*.glb"))
          for path in files:
              data = path.read_bytes()
              if len(data) < 20:
                  raise SystemExit(f"Invalid/truncated GLB: {path}")
              magic, version, declared_length = struct.unpack_from("<4sII", data, 0)
              if magic != b"glTF" or version != 2 or declared_length != len(data):
                  raise SystemExit(f"Invalid GLB header/length: {path}")
              chunk_length, chunk_type = struct.unpack_from("<I4s", data, 12)
              if chunk_type != b"JSON" or 20 + chunk_length > len(data):
                  raise SystemExit(f"Missing GLB JSON chunk: {path}")
              gltf = json.loads(data[20:20 + chunk_length].decode("utf-8"))
              if not gltf.get("meshes") or not any(m.get("primitives") for m in gltf["meshes"]):
                  raise SystemExit(f"No mesh primitives: {path}")
              materials = gltf.get("materials", [])
              if not materials:
                  raise SystemExit(f"No materials: {path}")
              seasonal_file = path.stem.endswith(("_spring", "_summer", "_autumn", "_winter"))
              if seasonal_file:
                  for material in materials:
                      pbr = material.get("pbrMetallicRoughness", {})
                      factor = pbr.get("baseColorFactor")
                      texture = pbr.get("baseColorTexture")
                      if not texture and (not isinstance(factor, list) or len(factor) != 4):
                          raise SystemExit(f"Missing exported base color/texture for {material.get('name')}: {path}")
              if path.name.startswith("grass_tuft_"):
                  textured = any(
                      material.get("pbrMetallicRoughness", {}).get("baseColorTexture")
                      for material in materials
                  )
                  if not textured or not gltf.get("images") or not gltf.get("textures"):
                      raise SystemExit(f"Grass blade texture was not embedded in GLB: {path}")
          print(f"GLB structure, colors and grass textures validated for {len(files)} seasonal files")
          PY
          python3 - <<'PY'
          import json, pathlib, struct
          path = pathlib.Path("assets/character/field_explorer.glb")
          data = path.read_bytes()
          magic, version, declared = struct.unpack_from("<4sII", data, 0)
          chunk_length, chunk_type = struct.unpack_from("<I4s", data, 12)
          gltf = json.loads(data[20:20 + chunk_length].decode("utf-8"))
          assert magic == b"glTF" and version == 2 and declared == len(data)
          assert chunk_type == b"JSON"
          animations = [item.get("name", "") for item in gltf.get("animations", [])]
          assert gltf.get("skins") and any("Idle" in name for name in animations)
          assert any("Walk" in name for name in animations) and any("Run" in name for name in animations)
          assert len(gltf.get("images", [])) >= 5
          assert all(item.get("pbrMetallicRoughness", {}).get("baseColorTexture") for item in gltf.get("materials", []))
          mesh_nodes = [node for node in gltf.get("nodes", []) if "mesh" in node]
          node_names = {node.get("name", "") for node in mesh_nodes}
          assert "Continuous field coat shell" in node_names and "Linen shirt torso" in node_names
          assert len(mesh_nodes) <= 20, f"Too many character mesh nodes/draw calls: {len(mesh_nodes)}"
          total_vertices = 0
          primitive_count = 0
          for mesh in gltf.get("meshes", []):
              for primitive in mesh.get("primitives", []):
                  attributes = primitive.get("attributes", {})
                  assert {"POSITION", "JOINTS_0", "WEIGHTS_0", "TEXCOORD_0"} <= set(attributes), "Unskinned or untextured character primitive"
                  total_vertices += gltf["accessors"][attributes["POSITION"]]["count"]
                  primitive_count += 1
          assert total_vertices >= 50000, f"Character mesh detail unexpectedly low: {total_vertices} vertices"
          print(f"Character GLB validation PASS: {len(mesh_nodes)} mesh nodes, {primitive_count} skinned textured primitives, {total_vertices} vertices, Idle/Walk/Run")
          PY
          du -h assets/generated/* assets/character/field_explorer.glb
      - name: Commit generated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/*.glb assets/character/field_explorer.glb
          if ! git diff --cached --quiet; then
            git commit -m "Generate procedural 3D environment asset pack"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push race detected; retrying after rebasing (attempt $attempt)"
              sleep 2
            done
            echo "::error::Could not push generated assets after three rebased attempts"
            exit 1
          fi
      - name: Upload 3D asset pack
        uses: actions/upload-artifact@v4
        with:
          name: game-3d-assets-${{ github.sha }}
          path: |
            assets/generated/*.glb
            assets/character/field_explorer.glb
          if-no-files-found: error
          retention-days: 30
