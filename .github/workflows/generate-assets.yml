name: Generate 3D asset pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/generate_assets.py"
      - ".github/workflows/generate-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Generate GLB models
        run: |
          blender --background --python tools/generate_assets.py -- --output assets/generated
          test "$(find assets/generated -maxdepth 1 -name '*.glb' | wc -l)" -eq 8
          du -h assets/generated/*
      - name: Commit generated models\n        run: |\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add assets/generated/*.glb\n          if ! git diff --cached --quiet; then\n            git commit -m "Generate procedural 3D environment asset pack"\n            git push\n          fi\n      - name: Upload 3D asset pack
        uses: actions/upload-artifact@v4
        with:
          name: game-3d-assets-${{ github.sha }}
          path: assets/generated/*.glb
          if-no-files-found: error
          retention-days: 30
