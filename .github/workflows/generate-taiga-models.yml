name: Generate Taiga 3D models
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/generate_taiga_models.py"
      - "tools/gen_model_textures.py"
      - "tools/requirements-models.txt"
      - ".github/workflows/generate-taiga-models.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install open-source mesh tooling
        run: python -m pip install -r tools/requirements-models.txt
      - name: Generate model textures
        run: python tools/gen_model_textures.py
      - name: Generate importable GLB assets
        run: python tools/generate_taiga_models.py
      - name: Verify generated GLB files
        run: |
          python - <<'PY'
          from pathlib import Path
          import trimesh
          files = sorted(Path("game/models/environment").glob("*.glb"))
          assert len(files) == 14, f"Expected 14 GLB models, got {len(files)}"
          for path in files:
              scene = trimesh.load(path, force="scene")
              assert len(scene.geometry) > 0, path
              assert scene.bounds.shape == (2, 3), path
              assert scene.bounds[1, 1] > scene.bounds[0, 1], f"Y-up height missing: {path}"
              for g in scene.geometry.values():
                  assert g.visual.kind == "texture" and g.visual.uv is not None, f"no UV/texture: {path}"
              print(path, "meshes=", len(scene.geometry), "bytes=", path.stat().st_size)
          PY
      - name: Commit generated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/models/environment tools
          if git diff --cached --quiet; then
            echo "No model changes."
          else
            git commit -m "Regenerate textured Taiga environment GLB models"
            git push
          fi
      - name: Upload importable GLB pack
        uses: actions/upload-artifact@v4
        with:
          name: taiga-environment-glb
          path: game/models/environment/*.glb
          if-no-files-found: error
          retention-days: 30
