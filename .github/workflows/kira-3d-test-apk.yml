name: Kira 3D test APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'kira_3d_test/**'
      - '.github/workflows/kira-3d-test-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Установка шаблонов экспорта и настроек Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates/ ~/.config/
          cp -r /root/.config/godot ~/.config/godot || true
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ || true

      - name: Импорт ресурсов
        working-directory: kira_3d_test
        run: godot --headless --import || true

      - name: Самопроверка (ходьба, бег, удар)
        working-directory: kira_3d_test
        run: |
          timeout 120 godot --headless -- --selftest 2>&1 | tee ../selftest.log || true
          grep -E "KIRA_" ../selftest.log || true

      - name: Сборка APK
        working-directory: kira_3d_test
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/kira_test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kira-test-apk
          path: |
            kira_3d_test/build/kira_test.apk
            selftest.log
